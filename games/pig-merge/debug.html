<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>西游合成 - 物理调试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}

/* ═══ 调试面板 ═══ */
#debugContainer{position:fixed;top:0;right:0;width:300px;height:100%;pointer-events:none;z-index:1000;}
#debugPanel{pointer-events:auto;position:absolute;top:10px;right:10px;width:280px;max-height:calc(100vh - 20px);background:rgba(20,20,40,0.92);border:1px solid rgba(100,100,200,0.4);border-radius:8px;color:#ccc;font-family:'Segoe UI',Tahoma,sans-serif;font-size:12px;display:flex;flex-direction:column;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
#debugPanel.collapsed #debugContent,
#debugPanel.collapsed .debug-export,
#debugPanel.collapsed .debug-buttons{display:none;}
.debug-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(60,60,120,0.6);font-weight:bold;color:#aaa;font-size:13px;border-bottom:1px solid rgba(100,100,200,0.3);flex-shrink:0;border-radius:8px 8px 0 0;}
.debug-toggle{background:rgba(100,100,200,0.5);border:1px solid rgba(100,100,200,0.6);border-radius:4px;color:#fff;cursor:pointer;font-size:16px;font-weight:bold;width:24px;height:24px;line-height:20px;text-align:center;padding:0;font-family:inherit;flex-shrink:0;}
.debug-toggle:hover{background:rgba(100,100,200,0.8);}
#debugContent{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;}
#debugContent::-webkit-scrollbar{width:6px;}
#debugContent::-webkit-scrollbar-track{background:rgba(40,40,60,0.3);}
#debugContent::-webkit-scrollbar-thumb{background:rgba(100,100,200,0.4);border-radius:3px;}
.debug-group{padding:8px 12px;border-bottom:1px solid rgba(60,60,100,0.3);}
.debug-group-title{color:#7a9adf;font-size:11px;font-weight:bold;margin-bottom:6px;letter-spacing:0.5px;}
.debug-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.debug-label{flex:1;font-size:11px;color:#bbb;}
.debug-value{min-width:50px;text-align:right;font-size:11px;color:#FFD700;font-family:monospace;}
.debug-slider{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(100,100,150,0.4);border-radius:2px;outline:none;cursor:pointer;margin-bottom:6px;}
.debug-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;background:#7a9adf;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,0.3);}
.debug-slider::-moz-range-thumb{width:14px;height:14px;background:#7a9adf;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,0.3);}
.debug-buttons{display:flex;gap:4px;padding:8px 12px;background:rgba(20,20,40,0.95);border-top:1px solid rgba(100,100,200,0.3);flex-shrink:0;border-radius:0 0 8px 8px;}
.debug-btn{flex:1;padding:6px 4px;background:rgba(100,100,200,0.4);border:1px solid rgba(100,100,200,0.6);border-radius:4px;color:#ddd;cursor:pointer;font-size:11px;text-align:center;font-family:inherit;}
.debug-btn:hover{background:rgba(100,100,200,0.6);}
.debug-btn.apply{background:rgba(80,180,80,0.3);border-color:rgba(80,180,80,0.5);}
.debug-btn.apply:hover{background:rgba(80,180,80,0.5);}
.debug-btn.reset{background:rgba(200,80,80,0.3);border-color:rgba(200,80,80,0.5);}
.debug-btn.reset:hover{background:rgba(200,80,80,0.5);}
.debug-export{display:none;padding:8px 12px;background:rgba(20,20,40,0.95);border-top:1px solid rgba(100,100,200,0.2);flex-shrink:0;}
.debug-export.visible{display:block;}
.debug-export textarea{width:100%;height:200px;background:rgba(10,10,30,0.9);color:#7f7;border:1px solid rgba(100,100,200,0.3);border-radius:4px;font-family:'Consolas','Monaco',monospace;font-size:10px;padding:6px;resize:vertical;outline:none;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="debugContainer">
  <div id="debugPanel">
    <div class="debug-header">
      <span>物理参数调试面板</span>
      <button id="debugToggle" class="debug-toggle">&minus;</button>
    </div>
    <div id="debugContent"></div>
    <div class="debug-export" id="debugExport">
      <textarea id="exportText" readonly></textarea>
    </div>
    <div class="debug-buttons">
      <button class="debug-btn apply" id="btnApply">应用弹性</button>
      <button class="debug-btn" id="btnExport">导出</button>
      <button class="debug-btn reset" id="btnReset">重置</button>
    </div>
  </div>
</div>
<script>
"use strict";
// ════════════════════════════════════════════════════
//  DEBUG 参数对象
// ════════════════════════════════════════════════════
var DEBUG = {
  // 下落物理
  gravity: 3000,
  dropVelocity: 200,
  airDamping: 1.000,
  highSpeedThreshold: 2000,
  highSpeedDamping: 1.000,

  // 碰撞参数
  collisionIterations: 8,
  tangentialFriction: 0.300,
  positionCorrection: 1.00,
  collisionSlop: 1.5,

  // 地面墙壁
  wallRestitution: 0.80,
  floorFriction: 0.30,
  groundDamping: 0.800,
  groundVelCutoff: 5,
  velSleepThreshold: 1,

  // 弹性系数
  baseRestitution: 0.50,
  restitutionDecay: 0.050,

  // 动画参数
  squishMax: 0.50,
  springBackMult: 0.5,
  tiltFactor: 1500,
  settledThreshold: 500,
  scaredThreshold: 500,

  // 游戏参数
  spawnDelay: 0.00,
  dangerTime: 0.5,
  substeps: 1
};
var DEBUG_DEFAULTS = JSON.parse(JSON.stringify(DEBUG));

// ════════════════════════════════════════════════════
//  调试面板滑块配置
// ════════════════════════════════════════════════════
var SLIDER_CONFIG = [
  { title: '下落物理', items: [
    { key: 'gravity',            label: '重力加速度',   min: 400,  max: 6000, step: 50 },
    { key: 'dropVelocity',       label: '初始下落速度', min: 0,    max: 500,  step: 5 },
    { key: 'airDamping',         label: '空气阻尼',     min: 0.95, max: 1.0,  step: 0.001 },
    { key: 'highSpeedThreshold', label: '高速阈值',     min: 200,  max: 3000, step: 50 },
    { key: 'highSpeedDamping',   label: '高速阻尼',     min: 0.95, max: 1.0,  step: 0.001 },
  ]},
  { title: '碰撞参数', items: [
    { key: 'collisionIterations', label: '碰撞迭代',   min: 1,    max: 12,   step: 1 },
    { key: 'tangentialFriction',  label: '切向摩擦',   min: 0,    max: 0.5,  step: 0.005 },
    { key: 'positionCorrection',  label: '位置修正',   min: 0.1,  max: 1.0,  step: 0.05 },
    { key: 'collisionSlop',       label: '碰撞容差',   min: 0,    max: 10,   step: 0.5 },
  ]},
  { title: '地面墙壁', items: [
    { key: 'wallRestitution',   label: '墙壁反弹',   min: 0,    max: 1.0,  step: 0.01 },
    { key: 'floorFriction',     label: '地面摩擦',   min: 0,    max: 1.0,  step: 0.01 },
    { key: 'groundDamping',     label: '地面阻尼',   min: 0.5,  max: 1.0,  step: 0.005 },
    { key: 'groundVelCutoff',   label: '速度截止',   min: 1,    max: 100,  step: 1 },
    { key: 'velSleepThreshold', label: '休眠阈值',   min: 1,    max: 20,   step: 1 },
  ]},
  { title: '弹性系数', items: [
    { key: 'baseRestitution',  label: '基础弹性',   min: 0.1,  max: 0.8,  step: 0.01 },
    { key: 'restitutionDecay', label: '每级递减',   min: 0,    max: 0.1,  step: 0.005 },
  ]},
  { title: '动画参数', items: [
    { key: 'squishMax',        label: '挤压最大',   min: 0.1,    max: 0.8,    step: 0.01 },
    { key: 'springBackMult',   label: '回弹速度',   min: 0.5,    max: 5.0,    step: 0.1 },
    { key: 'tiltFactor',       label: '倾斜因子',   min: 200,    max: 3000,   step: 50 },
    { key: 'settledThreshold', label: '稳定阈值',   min: 100,    max: 20000,  step: 100 },
    { key: 'scaredThreshold',  label: '害怕阈值',   min: 50,     max: 1000,   step: 10 },
  ]},
  { title: '游戏参数', items: [
    { key: 'spawnDelay', label: '生成延迟', min: 0,    max: 1.0, step: 0.05 },
    { key: 'dangerTime', label: '危险时间', min: 0.1,  max: 5.0, step: 0.1 },
    { key: 'substeps',   label: '子步进',   min: 1,    max: 8,   step: 1 },
  ]},
];

function formatVal(val, step) {
  if (step >= 1) return Math.round(val).toString();
  if (step >= 0.1) return val.toFixed(1);
  if (step >= 0.01) return val.toFixed(2);
  return val.toFixed(3);
}

function regenerateRestitution() {
  LEVEL_RESTITUTION = [];
  for (var i = 0; i < 10; i++) {
    LEVEL_RESTITUTION[i] = Math.max(0.01, DEBUG.baseRestitution - i * DEBUG.restitutionDecay);
  }
  if (window.game && window.game.physics) {
    var bodies = window.game.physics.bodies;
    for (var j = 0; j < bodies.length; j++) {
      var b = bodies[j];
      if (b.level && b.level <= 10) {
        b.restitution = LEVEL_RESTITUTION[b.level - 1];
      }
    }
  }
}

// ════════════════════════════════════════════════════
//  配置
// ════════════════════════════════════════════════════
var BASE_WIDTH = 375;
var PIG_LEVELS = [
  {level:1,radius:22, color:'#9966CC',dark:'#7B4FB0',score:0,  name:'小妖'},
  {level:2,radius:28, color:'#D0D0E0',dark:'#A0A0B0',score:12, name:'白骨精'},
  {level:3,radius:35, color:'#C04060',dark:'#8B2D4A',score:27, name:'蜘蛛精'},
  {level:4,radius:43, color:'#4A90A4',dark:'#2A7084',score:48, name:'沙悟净'},
  {level:5,radius:52, color:'#FFB6C1',dark:'#E09AA5',score:75, name:'猪八戒'},
  {level:6,radius:62, color:'#FFD700',dark:'#DAA520',score:108,name:'孙悟空'},
  {level:7,radius:73, color:'#FFF5E6',dark:'#E8D8C8',score:147,name:'观音菩萨'},
  {level:8,radius:85, color:'#FFC125',dark:'#D4A020',score:192,name:'如来佛祖'},
  {level:9,radius:95, color:'#FFD700',dark:'#B8860B',score:243,name:'玉皇大帝'},
  {level:10,radius:105,color:'#9370DB',dark:'#6A5ACD',score:300,name:'盘古'}
];
var MAX_LEVEL = 10;
var MIN_SPAWN_LEVEL = 1;
var MAX_SPAWN_LEVEL = 3;
var PHYSICS = {GRAVITY:1200,RESTITUTION:0.12,WALL_RESTITUTION:0.35,FLOOR_FRICTION:0.78,AIR_DAMPING:0.992,POSITION_ITERATIONS:6,SUBSTEPS:4};
var LAYOUT = {FENCE_RATIO:0.16,SPAWN_OFFSET:0.04,DANGER_TIME:2.0,SPAWN_DELAY:0.3};
var COLORS = {BG_TOP:'#1a1a2e',BG_BOTTOM:'#16213e',FENCE:'#4a4a6a',FENCE_DANGER:'#FF4444',FENCE_WARN:'#FFAA00',TEXT:'#FFFFFF',TEXT_DIM:'#8888aa',SCORE_BG:'rgba(255,255,255,0.1)',PARTICLE:['#FFD700','#FFA500','#FF6347','#FF69B4']};
var CFG = {BASE_WIDTH:BASE_WIDTH,PIG_LEVELS:PIG_LEVELS,MAX_LEVEL:MAX_LEVEL,MIN_SPAWN_LEVEL:MIN_SPAWN_LEVEL,MAX_SPAWN_LEVEL:MAX_SPAWN_LEVEL,PHYSICS:PHYSICS,LAYOUT:LAYOUT,COLORS:COLORS};

function shadeColor(hex,percent){var num=parseInt(hex.slice(1),16);var r=(num>>16)&0xff,g=(num>>8)&0xff,b=num&0xff;r=Math.max(0,Math.min(255,r+Math.round(r*percent/100)));g=Math.max(0,Math.min(255,g+Math.round(g*percent/100)));b=Math.max(0,Math.min(255,b+Math.round(b*percent/100)));return'rgb('+r+','+g+','+b+')';}

// ════════════════════════════════════════════════════
//  动物实体
// ════════════════════════════════════════════════════
var LEVEL_RESTITUTION = [];
regenerateRestitution();
var EXPR={IDLE:'idle',SCARED:'scared',DIZZY:'dizzy',HAPPY:'happy',CONFIDENT:'confident'};

function Pig(level,x,y,scale){
  this.level=level;this.scale=scale;
  var conf=CFG.PIG_LEVELS[level-1];
  this.radius=conf.radius*scale;this.color=conf.color;this.darkColor=conf.dark;this.score=conf.score;
  this.mass=this.radius*this.radius*0.01;
  this.restitution=LEVEL_RESTITUTION[level-1];
  this.x=x;this.y=y;this.vx=0;this.vy=0;
  this.static=true;this.merged=false;
  this.spawnAnim=0;this.dyingAnim=0;
  this.expression=level>=5?EXPR.CONFIDENT:EXPR.IDLE;
  this.expressionTimer=0;this.fallSpeed=0;
  this.wobble=Math.random()*Math.PI*2;
  this.squishX=1;this.squishY=1;this.squishAngle=0;
  this.tilt=0;
}
Pig.prototype.drop=function(){this.static=false;this.vy=DEBUG.dropVelocity;};
Pig.prototype.onImpact=function(strength,nx,ny){
  var amount=Math.min(DEBUG.squishMax,strength/1000);
  if(amount>this.squishX-1+0.05||amount>1-this.squishY+0.05){
    var isVertical=Math.abs(ny)>Math.abs(nx);
    if(isVertical){this.squishY=1-amount;this.squishX=1+amount*0.55;}
    else{this.squishX=1-amount;this.squishY=1+amount*0.55;}
    this.squishAngle=Math.atan2(ny,nx);
  }
  if(strength>350&&this.expression!==EXPR.HAPPY){
    this.expression=EXPR.DIZZY;this.expressionTimer=0.2+Math.min(0.3,strength/3000);
  }
};
Pig.prototype.setExpression=function(expr,duration){this.expression=expr;this.expressionTimer=duration||0;};
Pig.prototype.update=function(dt){
  if(this.spawnAnim<1)this.spawnAnim=Math.min(1,this.spawnAnim+dt*8);
  if(this.merged&&this.dyingAnim<1)this.dyingAnim=Math.min(1,this.dyingAnim+dt*12);
  this.wobble+=dt*2;
  var springBack=1-Math.pow(0.00001,dt);
  this.squishX+=(1-this.squishX)*springBack*DEBUG.springBackMult;
  this.squishY+=(1-this.squishY)*springBack*DEBUG.springBackMult;
  var targetTilt=this.static?0:Math.max(-0.25,Math.min(0.25,this.vx/DEBUG.tiltFactor));
  this.tilt+=(targetTilt-this.tilt)*0.15;
  this.fallSpeed=this.static?0:this.vy;
  if(this.expressionTimer>0){
    this.expressionTimer-=dt;
    if(this.expressionTimer<=0){this.expressionTimer=0;this.expression=this.level>=5?EXPR.CONFIDENT:EXPR.IDLE;}
  }else if(!this.static){
    if(this.vy>DEBUG.scaredThreshold){if(this.expression!==EXPR.SCARED)this.expression=EXPR.SCARED;}
    else if(this.vy<50&&Math.abs(this.vx)<30){
      var d=this.level>=5?EXPR.CONFIDENT:EXPR.IDLE;
      if(this.expression===EXPR.SCARED)this.expression=d;
    }
  }
};
Pig.prototype.getRenderScale=function(){
  if(this.merged)return 1-this.dyingAnim;
  if(this.spawnAnim<1){var t=this.spawnAnim,s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);}
  return 1;
};
Pig.prototype.getSquishScale=function(){return{sx:this.squishX,sy:this.squishY};};
Pig.prototype.isSettled=function(){return(this.vx*this.vx+this.vy*this.vy)<DEBUG.settledThreshold;};
Pig.prototype.getScareLevel=function(){if(this.expression!==EXPR.SCARED)return 0;return Math.min(1,this.fallSpeed/600);};

// ════════════════════════════════════════════════════
//  物理引擎
// ════════════════════════════════════════════════════
function PhysicsWorld(width,height){
  this.width=width;this.height=height;
  this.gravity=DEBUG.gravity;
  this.bodies=[];this.collisionPairs=[];this.impacts=[];
}
PhysicsWorld.prototype.add=function(b){this.bodies.push(b);};
PhysicsWorld.prototype.remove=function(b){var i=this.bodies.indexOf(b);if(i>=0)this.bodies.splice(i,1);};
PhysicsWorld.prototype.clear=function(){this.bodies.length=0;};
PhysicsWorld.prototype.step=function(dt){
  this.collisionPairs.length=0;this.impacts.length=0;
  var bodies=this.bodies,n=bodies.length;if(n===0)return;
  var iter=DEBUG.collisionIterations;
  for(var i=0;i<n;i++){var b=bodies[i];if(b.static)continue;b.vy+=this.gravity*dt;var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);var damp=sp>DEBUG.highSpeedThreshold?DEBUG.highSpeedDamping:DEBUG.airDamping;b.vx*=damp;b.vy*=damp;b.x+=b.vx*dt;b.y+=b.vy*dt;}
  for(var i2=0;i2<n;i2++){
    var b2=bodies[i2];if(b2.static)continue;var r=b2.radius;
    var wallE=b2.restitution!==undefined?Math.min(b2.restitution*1.2,0.6):DEBUG.wallRestitution;
    if(b2.x-r<0){b2.x=r;if(b2.vx<0){var iL=Math.abs(b2.vx);b2.vx=-b2.vx*wallE;this._recordImpact(b2,iL,1,0);}}
    if(b2.x+r>this.width){b2.x=this.width-r;if(b2.vx>0){var iR=Math.abs(b2.vx);b2.vx=-b2.vx*wallE;this._recordImpact(b2,iR,-1,0);}}
    if(b2.y+r>this.height){b2.y=this.height-r;if(b2.vy>0){var iF=Math.abs(b2.vy);b2.vy=-b2.vy*wallE;b2.vx*=DEBUG.floorFriction;this._recordImpact(b2,iF,0,-1);}b2.vx*=DEBUG.groundDamping;if(Math.abs(b2.vy)<DEBUG.groundVelCutoff)b2.vy=0;}
  }
  for(var it=0;it<iter;it++){for(var a=0;a<n;a++){for(var bb=a+1;bb<n;bb++){this._resolvePair(bodies[a],bodies[bb],it===0);}}}
  for(var i3=0;i3<n;i3++){var b3=bodies[i3];if(b3.static)continue;if(Math.abs(b3.vx)<DEBUG.velSleepThreshold)b3.vx*=0.5;if(Math.abs(b3.vy)<DEBUG.velSleepThreshold&&b3.y+b3.radius>this.height-3)b3.vy=0;}
};
PhysicsWorld.prototype._recordImpact=function(body,strength,nx,ny){if(strength<80)return;if(body.onImpact)body.onImpact(strength,nx,ny);this.impacts.push({body:body,strength:strength,nx:nx,ny:ny});};
PhysicsWorld.prototype._resolvePair=function(a,b,recordCollision){
  if(a.static&&b.static)return;
  var dx=b.x-a.x,dy=b.y-a.y,distSq=dx*dx+dy*dy,minDist=a.radius+b.radius;
  if(distSq>=minDist*minDist)return;
  var dist=Math.sqrt(distSq);if(dist===0){dx=1;dy=0;dist=1;}
  var nx=dx/dist,ny=dy/dist,overlap=minDist-dist;
  var slop=DEBUG.collisionSlop,totalInvMass=(a.static?0:1/a.mass)+(b.static?0:1/b.mass);
  if(totalInvMass===0)return;
  var correction=Math.max(overlap-slop,0)*DEBUG.positionCorrection/totalInvMass;
  if(!a.static){a.x-=nx*correction/a.mass;a.y-=ny*correction/a.mass;}
  if(!b.static){b.x+=nx*correction/b.mass;b.y+=ny*correction/b.mass;}
  var dvx=b.vx-a.vx,dvy=b.vy-a.vy,velAlongNormal=dvx*nx+dvy*ny;
  if(velAlongNormal>0)return;
  var eA=a.restitution!==undefined?a.restitution:CFG.PHYSICS.RESTITUTION;
  var eB=b.restitution!==undefined?b.restitution:CFG.PHYSICS.RESTITUTION;
  var e=Math.min(eA,eB);
  var j=-(1+e)*velAlongNormal/totalInvMass;
  var impactStrength=Math.abs(velAlongNormal);
  if(recordCollision&&impactStrength>80){
    if(!a.static&&a.onImpact)a.onImpact(impactStrength,-nx,-ny);
    if(!b.static&&b.onImpact)b.onImpact(impactStrength,nx,ny);
  }
  if(!a.static){a.vx-=(j/a.mass)*nx;a.vy-=(j/a.mass)*ny;}
  if(!b.static){b.vx+=(j/b.mass)*nx;b.vy+=(j/b.mass)*ny;}
  var tx=-ny,ty=nx,velAlongTangent=dvx*tx+dvy*ty,friction=DEBUG.tangentialFriction;
  var jt=-velAlongTangent*friction/totalInvMass;
  if(!a.static){a.vx-=(jt/a.mass)*tx;a.vy-=(jt/a.mass)*ty;}
  if(!b.static){b.vx+=(jt/b.mass)*tx;b.vy+=(jt/b.mass)*ty;}
  if(recordCollision&&a.level===b.level&&!a.merged&&!b.merged&&a.level<CFG.MAX_LEVEL&&!a.static&&!b.static){
    this.collisionPairs.push({a:a,b:b});
  }
};

// ════════════════════════════════════════════════════
//  特效系统
// ════════════════════════════════════════════════════
function Particle(x,y,color){this.x=x;this.y=y;var a=Math.random()*Math.PI*2,s=80+Math.random()*200;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-80;this.life=1;this.maxLife=0.5+Math.random()*0.3;this.size=3+Math.random()*5;this.color=color;}
Particle.prototype.update=function(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=600*dt;this.vx*=0.96;this.life-=dt/this.maxLife;return this.life>0;};
function ScorePopup(x,y,score,scale){this.x=x;this.y=y;this.startY=y;this.score=score;this.life=1;this.maxLife=1;this.scale=scale;}
ScorePopup.prototype.update=function(dt){this.y-=60*dt;this.life-=dt/this.maxLife;return this.life>0;};
function EffectManager(){this.particles=[];this.popups=[];}
EffectManager.prototype.burst=function(x,y,color,count){count=count||12;var pal=[color].concat(CFG.COLORS.PARTICLE);for(var i=0;i<count;i++){this.particles.push(new Particle(x,y,pal[Math.floor(Math.random()*pal.length)]));}};
EffectManager.prototype.popup=function(x,y,score,scale){this.popups.push(new ScorePopup(x,y,score,scale));};
EffectManager.prototype.update=function(dt){for(var i=this.particles.length-1;i>=0;i--){if(!this.particles[i].update(dt))this.particles.splice(i,1);}for(var j=this.popups.length-1;j>=0;j--){if(!this.popups[j].update(dt))this.popups.splice(j,1);}};
EffectManager.prototype.render=function(ctx){for(var i=0;i<this.particles.length;i++){var p=this.particles[i],al=Math.max(0,p.life);ctx.globalAlpha=al;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*al,0,Math.PI*2);ctx.fill();}for(var j=0;j<this.popups.length;j++){var s=this.popups[j],a=Math.max(0,s.life);ctx.globalAlpha=a;ctx.fillStyle='#FFD700';ctx.font='bold '+Math.round(22*s.scale)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+'+s.score,s.x,s.y);}ctx.globalAlpha=1;};
EffectManager.prototype.clear=function(){this.particles.length=0;this.popups.length=0;};

// ════════════════════════════════════════════════════
//  渲染器
// ════════════════════════════════════════════════════
function Renderer(ctx,width,height,scale){this.ctx=ctx;this.width=width;this.height=height;this.scale=scale;this.fenceY=height*CFG.LAYOUT.FENCE_RATIO;this._time=0;}
Renderer.prototype.tick=function(dt){this._time+=dt;};
Renderer.prototype.drawBackground=function(){var ctx=this.ctx;var g=ctx.createLinearGradient(0,0,0,this.height);g.addColorStop(0,CFG.COLORS.BG_TOP);g.addColorStop(1,CFG.COLORS.BG_BOTTOM);ctx.fillStyle=g;ctx.fillRect(0,0,this.width,this.height);};
Renderer.prototype.drawFence=function(state,dangerProgress){
  var ctx=this.ctx,y=this.fenceY,color=CFG.COLORS.FENCE;
  if(state==='warn')color=CFG.COLORS.FENCE_WARN;if(state==='danger')color=CFG.COLORS.FENCE_DANGER;
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2*this.scale;ctx.setLineDash([12*this.scale,8*this.scale]);
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(this.width,y);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,y,4*this.scale,0,Math.PI*2);ctx.arc(this.width,y,4*this.scale,0,Math.PI*2);ctx.fill();
  if(dangerProgress>0){ctx.fillStyle='rgba(255,68,68,'+(0.2+dangerProgress*0.3)+')';ctx.fillRect(0,0,this.width,y);}
  ctx.restore();
};
Renderer.prototype._roundRectPath=function(x,y,w,h,r){var ctx=this.ctx;ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);};
Renderer.prototype._roundRect=function(x,y,w,h,r){var ctx=this.ctx;ctx.beginPath();this._roundRectPath(x,y,w,h,r);};
Renderer.prototype.drawUI=function(score,bestScore,nextLevel){
  var ctx=this.ctx,pad=12*this.scale;ctx.fillStyle=CFG.COLORS.SCORE_BG;var pW=120*this.scale,pH=48*this.scale;this._roundRect(pad,pad,pW,pH,8*this.scale);ctx.fill();
  ctx.fillStyle=CFG.COLORS.TEXT_DIM;ctx.font=Math.round(11*this.scale)+'px Arial';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('分数',pad+10*this.scale,pad+6*this.scale);
  ctx.fillStyle=CFG.COLORS.TEXT;ctx.font='bold '+Math.round(20*this.scale)+'px Arial';ctx.fillText(score.toString(),pad+10*this.scale,pad+20*this.scale);
  if(bestScore>0){ctx.fillStyle=CFG.COLORS.TEXT_DIM;ctx.font=Math.round(10*this.scale)+'px Arial';ctx.textAlign='right';ctx.fillText('最高: '+bestScore,pad+pW-8*this.scale,pad+6*this.scale);}
  if(nextLevel>0){var pvR=18*this.scale,pvX=this.width-pad-pvR,pvY=pad+pvR+4*this.scale;ctx.fillStyle=CFG.COLORS.TEXT_DIM;ctx.font=Math.round(10*this.scale)+'px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('下一个',pvX,pad);var conf=CFG.PIG_LEVELS[nextLevel-1];var g=ctx.createRadialGradient(pvX-pvR*0.3,pvY-pvR*0.3,0,pvX,pvY,pvR);g.addColorStop(0,shadeColor(conf.color,25));g.addColorStop(1,conf.color);ctx.fillStyle=g;ctx.beginPath();ctx.arc(pvX,pvY,pvR,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold '+Math.round(10*this.scale)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(conf.name,pvX,pvY);}
};
Renderer.prototype.drawStartScreen=function(){
  var ctx=this.ctx;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,this.width,this.height);
  ctx.fillStyle='#FFB6C1';ctx.font='bold '+Math.round(36*this.scale)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('西游合成',this.width/2,this.height*0.30);
  ctx.fillStyle='#FFD93D';ctx.font=Math.round(16*this.scale)+'px Arial';ctx.fillText('小妖 → 白骨精 → 蜘蛛精 → 沙悟净 → ...',this.width/2,this.height*0.37);
  ctx.fillStyle='#fff';ctx.font=Math.round(14*this.scale)+'px Arial';var tips=['滑动手指选择下落位置','松手让角色落下','两个相同角色碰撞合成更高级别','角色超过顶部栅栏则游戏结束'];for(var i=0;i<tips.length;i++)ctx.fillText(tips[i],this.width/2,this.height*0.45+i*28*this.scale);
  var bW=180*this.scale,bH=50*this.scale,bX=(this.width-bW)/2,bY=this.height*0.68;ctx.fillStyle='#FF6B8A';this._roundRect(bX,bY,bW,bH,25*this.scale);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold '+Math.round(20*this.scale)+'px Arial';ctx.fillText('开始游戏',this.width/2,bY+bH/2);
};
Renderer.prototype.drawGameOver=function(score,bestScore,isNewBest){
  var ctx=this.ctx;ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,this.width,this.height);
  ctx.fillStyle='#FF6B8A';ctx.font='bold '+Math.round(32*this.scale)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('游戏结束',this.width/2,this.height*0.3);
  ctx.fillStyle=CFG.COLORS.TEXT_DIM;ctx.font=Math.round(14*this.scale)+'px Arial';ctx.fillText('本局得分',this.width/2,this.height*0.4);
  ctx.fillStyle='#FFD700';ctx.font='bold '+Math.round(48*this.scale)+'px Arial';ctx.fillText(score.toString(),this.width/2,this.height*0.46);
  ctx.fillStyle=CFG.COLORS.TEXT_DIM;ctx.font=Math.round(14*this.scale)+'px Arial';if(isNewBest){ctx.fillStyle='#FFD700';ctx.fillText('新纪录！',this.width/2,this.height*0.54);}else{ctx.fillText('最高分: '+bestScore,this.width/2,this.height*0.54);}
  var bW=180*this.scale,bH=50*this.scale,bX=(this.width-bW)/2,bY=this.height*0.64;ctx.fillStyle='#FF6B8A';this._roundRect(bX,bY,bW,bH,25*this.scale);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold '+Math.round(20*this.scale)+'px Arial';ctx.fillText('再来一局',this.width/2,bY+bH/2);
};
Renderer.prototype.drawPig=function(pig,isPreview){
  var ctx=this.ctx,s=pig.getRenderScale();if(s<=0)return;
  var r=pig.radius*s,squish=pig.getSquishScale(),x=pig.x,y=pig.y;
  var breath=1;if(!isPreview&&!pig.static)breath=1+Math.sin(pig.wobble)*0.02;r*=breath;
  if(isPreview){ctx.save();ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2*this.scale;ctx.setLineDash([4*this.scale,4*this.scale]);ctx.beginPath();ctx.moveTo(x,y+r);ctx.lineTo(x,this.height);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
  if(!isPreview){ctx.save();ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x,y+r*0.85,r*0.75*squish.sx,r*0.12,0,0,Math.PI*2);ctx.fill();ctx.restore();}
  if(pig.level===7)this._drawLotusPetals(x,y,r,pig.tilt);
  if(pig.level===8)this._drawBuddhaAura(x,y,r,pig.tilt);
  if(pig.level===9)this._drawImperialAura(x,y,r,pig.tilt);
  if(pig.level===10)this._drawChaosSwirl(x,y,r,pig.tilt);
  ctx.save();ctx.translate(x,y);ctx.rotate(pig.tilt);ctx.scale(squish.sx,squish.sy);
  this._drawBody(r,pig);this._drawEars(r,pig);this._drawFace(r,pig);this._drawAccessory(r,pig);
  if(pig.expression==='scared')this._drawSweat(r,pig.getScareLevel());
  if(pig.expression==='dizzy')this._drawDizzyStars(r);
  ctx.restore();
};
Renderer.prototype._drawBody=function(r,pig){
  var ctx=this.ctx,g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
  g.addColorStop(0,shadeColor(pig.color,25));g.addColorStop(0.7,pig.color);g.addColorStop(1,pig.darkColor);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.ellipse(-r*0.3,-r*0.35,r*0.25,r*0.15,-0.5,0,Math.PI*2);ctx.fill();
  // ── 级别专属身体标记 ──
  if(pig.level===1){
    // 小妖：腹部深色条纹
    ctx.fillStyle=shadeColor(pig.darkColor,-10);ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.35,r*0.22,0,0,Math.PI*2);ctx.fill();
  }
  if(pig.level===2){
    // 白骨精：肋骨纹路
    ctx.strokeStyle=shadeColor(pig.darkColor,-15);ctx.lineWidth=r*0.03;
    for(var bi=0;bi<4;bi++){ctx.beginPath();ctx.moveTo(-r*0.2+bi*r*0.12,r*0.05);ctx.lineTo(-r*0.2+bi*r*0.12,r*0.35);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-r*0.2,r*0.2);ctx.lineTo(r*0.2,r*0.2);ctx.stroke();
  }
  if(pig.level===3){
    // 蜘蛛精：蛛网纹
    ctx.strokeStyle=shadeColor(pig.darkColor,-5);ctx.lineWidth=r*0.02;
    for(var wi=0;wi<6;wi++){var wa=wi*Math.PI/3;ctx.beginPath();ctx.moveTo(0,r*0.2);ctx.lineTo(Math.cos(wa)*r*0.4,r*0.2+Math.sin(wa)*r*0.25);ctx.stroke();}
    for(var ring=1;ring<=2;ring++){ctx.beginPath();ctx.arc(0,r*0.2,r*0.15*ring,0,Math.PI*2);ctx.stroke();}
  }
  if(pig.level===4){
    // 沙悟净：僧袍V领
    ctx.fillStyle=shadeColor(pig.color,-15);ctx.beginPath();ctx.moveTo(0,-r*0.1);ctx.lineTo(-r*0.4,r*0.5);ctx.lineTo(r*0.4,r*0.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8B4513';ctx.beginPath();ctx.ellipse(0,r*0.5,r*0.12,r*0.06,0,0,Math.PI*2);ctx.fill();
  }
  if(pig.level===5){
    // 猪八戒：大肚皮
    ctx.fillStyle=shadeColor(pig.color,20);ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.5,r*0.38,0,0,Math.PI*2);ctx.fill();
    // 肚脐
    ctx.fillStyle=shadeColor(pig.darkColor,-10);ctx.beginPath();ctx.arc(0,r*0.3,r*0.04,0,Math.PI*2);ctx.fill();
  }
  if(pig.level===6){
    // 孙悟空：虎皮裙纹
    ctx.fillStyle='#FF8800';ctx.beginPath();ctx.ellipse(0,r*0.35,r*0.45,r*0.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a2a1a';for(var si=0;si<4;si++){ctx.beginPath();ctx.ellipse(-r*0.3+si*r*0.2,r*0.35,r*0.04,r*0.08,0,0,Math.PI*2);ctx.fill();}
  }
  if(pig.level===7){
    // 观音菩萨：白色衣袍
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.45,r*0.3,0,0,Math.PI*2);ctx.fill();
    // 金线纹饰
    ctx.strokeStyle='rgba(255,215,0,0.5)';ctx.lineWidth=r*0.02;ctx.beginPath();ctx.arc(0,r*0.3,r*0.3,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  }
  if(pig.level===8){
    // 如来佛祖：金色袈裟纹
    ctx.fillStyle=shadeColor(pig.color,-5);ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.5,r*0.32,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,200,0.6)';ctx.lineWidth=r*0.02;
    for(var qi=0;qi<5;qi++){var qx=-r*0.35+qi*r*0.18;ctx.beginPath();ctx.moveTo(qx,r*0.1);ctx.lineTo(qx,r*0.5);ctx.stroke();}
  }
  if(pig.level===9){
    // 玉皇大帝：龙袍纹饰
    ctx.fillStyle=shadeColor(pig.color,-10);ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.5,r*0.35,0,0,Math.PI*2);ctx.fill();
    // 龙纹
    ctx.strokeStyle='rgba(255,255,200,0.5)';ctx.lineWidth=r*0.03;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-r*0.3,r*0.15);ctx.quadraticCurveTo(-r*0.1,r*0.05,r*0.1,r*0.2);ctx.quadraticCurveTo(r*0.3,r*0.35,r*0.3,r*0.45);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*0.3,r*0.4);ctx.quadraticCurveTo(-r*0.15,r*0.3,0,r*0.45);ctx.stroke();
    ctx.lineCap='butt';
    // 云纹
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(-r*0.25,r*0.1,r*0.06,0,Math.PI*2);ctx.arc(r*0.25,r*0.1,r*0.06,0,Math.PI*2);ctx.fill();
  }
  if(pig.level===10){
    // 盘古：混沌星辰体
    ctx.fillStyle=shadeColor(pig.darkColor,-15);ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.5,r*0.35,0,0,Math.PI*2);ctx.fill();
    // 星辰
    ctx.fillStyle='rgba(255,255,255,0.6)';
    for(var sti=0;sti<6;sti++){var sang=sti*Math.PI/3,ssx=Math.cos(sang)*r*0.3,ssy=r*0.3+Math.sin(sang)*r*0.18;ctx.beginPath();ctx.arc(ssx,ssy,r*0.03,0,Math.PI*2);ctx.fill();}
    // 混沌漩涡
    ctx.strokeStyle='rgba(200,180,255,0.4)';ctx.lineWidth=r*0.02;
    ctx.beginPath();ctx.arc(0,r*0.3,r*0.15,0,Math.PI*1.5);ctx.stroke();
    ctx.beginPath();ctx.arc(0,r*0.3,r*0.25,Math.PI*0.5,Math.PI*2);ctx.stroke();
  }
  // 腮红（低级别）
  if(pig.level<=3){ctx.fillStyle='rgba(200,100,130,0.25)';ctx.beginPath();ctx.arc(-r*0.45,r*0.05,r*0.12,0,Math.PI*2);ctx.arc(r*0.45,r*0.05,r*0.12,0,Math.PI*2);ctx.fill();}
};
Renderer.prototype._drawEars=function(r,pig){
  var ctx=this.ctx,lv=pig.level;
  if(lv===1){
    // 小妖：弯角恶魔角
    ctx.fillStyle=shadeColor(pig.darkColor,-10);
    ctx.beginPath();ctx.moveTo(-r*0.4,-r*0.7);ctx.quadraticCurveTo(-r*0.6,-r*1.1,-r*0.25,-r*1.0);ctx.quadraticCurveTo(-r*0.2,-r*0.85,-r*0.35,-r*0.7);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.4,-r*0.7);ctx.quadraticCurveTo(r*0.6,-r*1.1,r*0.25,-r*1.0);ctx.quadraticCurveTo(r*0.2,-r*0.85,r*0.35,-r*0.7);ctx.closePath();ctx.fill();
  }else if(lv===2){
    // 白骨精：骨质尖刺
    ctx.fillStyle=shadeColor(pig.color,-5);
    ctx.beginPath();ctx.moveTo(-r*0.45,-r*0.65);ctx.lineTo(-r*0.5,-r*1.15);ctx.lineTo(-r*0.3,-r*0.7);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.45,-r*0.65);ctx.lineTo(r*0.5,-r*1.15);ctx.lineTo(r*0.3,-r*0.7);ctx.closePath();ctx.fill();
    // 骨刺高光
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath();ctx.moveTo(-r*0.42,-r*0.7);ctx.lineTo(-r*0.45,-r*1.05);ctx.lineTo(-r*0.38,-r*0.75);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.42,-r*0.7);ctx.lineTo(r*0.45,-r*1.05);ctx.lineTo(r*0.38,-r*0.75);ctx.closePath();ctx.fill();
  }else if(lv===3){
    // 蜘蛛精：蛛腿触角
    ctx.strokeStyle=shadeColor(pig.darkColor,-5);ctx.lineWidth=r*0.04;ctx.lineCap='round';
    for(var si=0;si<3;si++){
      var ox=-r*0.4+si*r*0.4;
      ctx.beginPath();ctx.moveTo(ox,-r*0.85);ctx.quadraticCurveTo(ox+r*0.1,-r*1.15,ox+r*0.05,-r*1.25);ctx.stroke();
    }
    ctx.lineCap='butt';
  }else if(lv===4){
    // 沙悟净：大鬓角 + 戒疤点
    ctx.fillStyle=shadeColor(pig.darkColor,-15);
    ctx.beginPath();ctx.ellipse(-r*0.75,-r*0.2,r*0.18,r*0.4,-0.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.75,-r*0.2,r*0.18,r*0.4,0.2,0,Math.PI*2);ctx.fill();
    // 戒疤
    ctx.fillStyle='#8B4513';
    for(var di=0;di<3;di++){ctx.beginPath();ctx.arc(-r*0.12+di*r*0.12,-r*0.78,r*0.03,0,Math.PI*2);ctx.fill();}
  }else if(lv===5){
    // 猪八戒：大扇风耳
    ctx.fillStyle=shadeColor(pig.color,-8);
    ctx.beginPath();ctx.ellipse(-r*0.85,-r*0.1,r*0.2,r*0.4,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.85,-r*0.1,r*0.2,r*0.4,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=shadeColor(pig.color,-20);
    ctx.beginPath();ctx.ellipse(-r*0.82,-r*0.1,r*0.1,r*0.25,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.82,-r*0.1,r*0.1,r*0.25,0.3,0,Math.PI*2);ctx.fill();
  }else if(lv===6){
    // 孙悟空：猴耳 + 金箍
    ctx.fillStyle=shadeColor(pig.color,-10);
    ctx.beginPath();ctx.ellipse(-r*0.7,-r*0.3,r*0.15,r*0.22,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.7,-r*0.3,r*0.15,r*0.22,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF6B6B';
    ctx.beginPath();ctx.ellipse(-r*0.68,-r*0.28,r*0.07,r*0.12,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.68,-r*0.28,r*0.07,r*0.12,0.3,0,Math.PI*2);ctx.fill();
    // 金箍（紧箍咒）
    ctx.strokeStyle='#FFD700';ctx.lineWidth=r*0.08;
    ctx.beginPath();ctx.ellipse(0,-r*0.55,r*0.7,r*0.18,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#DAA520';ctx.lineWidth=r*0.03;
    ctx.beginPath();ctx.ellipse(0,-r*0.55,r*0.7,r*0.18,0,0,Math.PI*2);ctx.stroke();
    // 金箍两侧月牙
    ctx.fillStyle='#FFD700';
    ctx.beginPath();ctx.arc(-r*0.7,-r*0.55,r*0.06,0,Math.PI*2);ctx.arc(r*0.7,-r*0.55,r*0.06,0,Math.PI*2);ctx.fill();
  }else if(lv===7){
    // 观音菩萨：长耳垂 + 高发髻

  }else if(lv===10){

    ctx.fillStyle=shadeColor(pig.darkColor,-20);

Renderer.prototype._drawFace=function(r,pig){var expr=pig.expression;this._drawSnout(r,pig);this._drawEyes(r,expr,pig);this._drawMouth(r,expr,pig);};
Renderer.prototype._drawSnout=function(r,pig){

  }else if(lv===2){
    // 白骨精：骷髅鼻孔
    ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.ellipse(-r*0.06,r*0.15,r*0.04,r*0.06,0,0,Math.PI*2);ctx.ellipse(r*0.06,r*0.15,r*0.04,r*0.06,0,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.moveTo(r*0.1,r*0.15);ctx.lineTo(r*0.07,r*0.28);ctx.lineTo(r*0.04,r*0.15);ctx.closePath();ctx.fill();

  }else if(lv===4){
    // 沙悟净：络腮胡
    ctx.fillStyle=shadeColor(pig.darkColor,-20);ctx.beginPath();ctx.ellipse(0,r*0.25,r*0.35,r*0.22,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.ellipse(-r*0.06,r*0.18,r*0.04,r*0.05,0,0,Math.PI*2);ctx.ellipse(r*0.06,r*0.18,r*0.04,r*0.05,0,0,Math.PI*2);ctx.fill();
  }else if(lv===6){
    // 孙悟空：猴脸心形

    // 鼻孔
    ctx.fillStyle=shadeColor(pig.darkColor,-10);ctx.beginPath();ctx.ellipse(-r*0.05,r*0.15,r*0.025,r*0.035,0,0,Math.PI*2);ctx.ellipse(r*0.05,r*0.15,r*0.025,r*0.035,0,0,Math.PI*2);ctx.fill();
  }else if(lv===7){

    ctx.fillStyle=shadeColor(pig.color,-8);ctx.beginPath();ctx.ellipse(0,r*0.12,r*0.08,r*0.05,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=shadeColor(pig.color,-8);ctx.beginPath();ctx.ellipse(0,r*0.1,r*0.07,r*0.05,0,0,Math.PI*2);ctx.fill();
    // 额头帝徽
    ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(0,-r*0.3,r*0.06,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=shadeColor(pig.color,-10);ctx.beginPath();ctx.ellipse(0,r*0.12,r*0.08,r*0.06,0,0,Math.PI*2);ctx.fill();

Renderer.prototype._drawEyes=function(r,expr,pig){
  var ctx=this.ctx,eO=r*0.3,eY=-r*0.1;
  if(expr==='scared'){var sc=pig.getScareLevel(),bR=r*(0.13+sc*0.05);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-eO,eY,bR,0,Math.PI*2);ctx.arc(eO,eY,bR,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';var pR=bR*(0.4-sc*0.15);ctx.beginPath();ctx.arc(-eO,eY+bR*0.1,pR,0,Math.PI*2);ctx.arc(eO,eY+bR*0.1,pR,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#553333';ctx.lineWidth=r*0.04;ctx.beginPath();ctx.moveTo(-eO-r*0.12,eY-bR-r*0.08);ctx.lineTo(-eO+r*0.08,eY-bR-r*0.14);ctx.moveTo(eO-r*0.08,eY-bR-r*0.14);ctx.lineTo(eO+r*0.12,eY-bR-r*0.08);ctx.stroke();}

  else if(expr==='happy'){ctx.strokeStyle='#333';ctx.lineWidth=r*0.05;ctx.lineCap='round';ctx.beginPath();ctx.arc(-eO,eY+r*0.02,r*0.1,Math.PI*1.15,Math.PI*1.85,false);ctx.arc(eO,eY+r*0.02,r*0.1,Math.PI*1.15,Math.PI*1.85,false);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='rgba(255,120,140,0.4)';ctx.beginPath();ctx.arc(-r*0.5,r*0.05,r*0.1,0,Math.PI*2);ctx.arc(r*0.5,r*0.05,r*0.1,0,Math.PI*2);ctx.fill();}

  else{var eR3=r*0.12;ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-eO,eY,eR3,0,Math.PI*2);ctx.arc(eO,eY,eR3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-eO+eR3*0.3,eY-eR3*0.3,eR3*0.4,0,Math.PI*2);ctx.arc(eO+eR3*0.3,eY-eR3*0.3,eR3*0.4,0,Math.PI*2);ctx.fill();}
};
Renderer.prototype._drawMouth=function(r,expr,pig){

Renderer.prototype._drawSweat=function(r,sc){

Renderer.prototype._drawDizzyStars=function(r){var ang=this._time*4;for(var i=0;i<3;i++){var a=ang+i*(Math.PI*2/3),sx=Math.cos(a)*r*0.7,sy=-r*0.65+Math.sin(a)*r*0.12;this._drawStar(sx,sy,r*0.06,'#FFD700');}};

Renderer.prototype._drawAccessory=function(r,pig){

  }else if(lv===5){

    ctx.fillStyle='rgba(220,20,20,0.5)';ctx.beginPath();ctx.moveTo(-r*0.5,r*0.4);ctx.quadraticCurveTo(-r*0.9,r*0.6,-r*0.7,r*0.8);ctx.quadraticCurveTo(-r*0.5,r*0.6,-r*0.3,r*0.5);ctx.closePath();ctx.fill();

    for(var li=0;li<6;li++){var la=li*Math.PI/3;var lx=Math.cos(la)*r*0.5,ly=r*0.7+Math.sin(la)*r*0.1;ctx.beginPath();ctx.ellipse(lx,ly,r*0.12,r*0.06,la,0,Math.PI*2);ctx.fill();}

    ctx.lineCap='butt';
  }else if(lv===8){
    // 如来佛祖：法轮 + 莲花座
    ctx.fillStyle='rgba(255,215,0,0.5)';
    for(var fi=0;fi<8;fi++){var fa=fi*Math.PI/4;var fx=Math.cos(fa)*r*0.5,ly2=r*0.7+Math.sin(fa)*r*0.1;ctx.beginPath();ctx.ellipse(fx,ly2,r*0.13,r*0.07,fa,0,Math.PI*2);ctx.fill();}
    // 法轮
    ctx.strokeStyle='rgba(255,215,0,0.6)';ctx.lineWidth=r*0.03;
    ctx.beginPath();ctx.arc(0,r*0.45,r*0.15,0,Math.PI*2);ctx.stroke();
    for(var spi=0;spi<8;spi++){var sa=spi*Math.PI/4;ctx.beginPath();ctx.moveTo(0,r*0.45);ctx.lineTo(Math.cos(sa)*r*0.15,r*0.45+Math.sin(sa)*r*0.15);ctx.stroke();}
  }else if(lv===9){
    // 玉皇大帝：玉玺 + 龙纹云座
    // 云纹宝座
    ctx.fillStyle='rgba(255,215,0,0.4)';
    for(var cli=0;cli<8;cli++){var cla=cli*Math.PI/4;var clx=Math.cos(cla)*r*0.5,cly=r*0.7+Math.sin(cla)*r*0.1;ctx.beginPath();ctx.ellipse(clx,cly,r*0.14,r*0.07,cla,0,Math.PI*2);ctx.fill();}
    // 玉玺
    ctx.fillStyle='#4169E1';
    ctx.fillRect(-r*0.12,r*0.0,r*0.24,r*0.2);
    ctx.fillStyle='#FFD700';
    ctx.fillRect(-r*0.08,r*0.0,r*0.16,r*0.06);
    // 龙形手柄
    ctx.strokeStyle='rgba(255,215,0,0.5)';ctx.lineWidth=r*0.03;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,r*0.0);ctx.quadraticCurveTo(r*0.1,-r*0.15,0,-r*0.2);ctx.quadraticCurveTo(-r*0.1,-r*0.15,0,r*0.0);ctx.stroke();
    ctx.lineCap='butt';
  }else if(lv===10){
    // 盘古：盘古斧 + 混沌球
    // 混沌宝座
    ctx.fillStyle='rgba(147,112,219,0.4)';
    for(var pli=0;pli<8;pli++){var pla=pli*Math.PI/4;var plx=Math.cos(pla)*r*0.5,ply=r*0.7+Math.sin(pla)*r*0.1;ctx.beginPath();ctx.ellipse(plx,ply,r*0.15,r*0.08,pla,0,Math.PI*2);ctx.fill();}
    // 盘古斧
    ctx.save();ctx.rotate(0.3);
    // 斧柄
    ctx.fillStyle='#8B4513';ctx.fillRect(r*0.3,-r*0.05,r*0.7,r*0.08);
    // 斧头
    ctx.fillStyle='#C0C0C0';
    ctx.beginPath();ctx.moveTo(r*0.85,-r*0.05);ctx.lineTo(r*0.85+r*0.25,-r*0.2);ctx.lineTo(r*0.85+r*0.3,r*0.15);ctx.lineTo(r*0.85,r*0.15);ctx.closePath();ctx.fill();
    // 斧刃高光
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.moveTo(r*1.05,-r*0.15);ctx.lineTo(r*1.1,r*0.1);ctx.lineTo(r*1.05,r*0.1);ctx.closePath();ctx.fill();
    ctx.restore();
    // 混沌球
    var cg=ctx.createRadialGradient(-r*0.5,r*0.2,0,-r*0.5,r*0.2,r*0.15);
    cg.addColorStop(0,'rgba(200,180,255,0.6)');cg.addColorStop(1,'rgba(100,80,180,0.2)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(-r*0.5,r*0.2,r*0.15,0,Math.PI*2);ctx.fill();
  }
  // 级别数字
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='bold '+Math.round(r*0.18)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pig.level,0,r*0.72);
};
Renderer.prototype._drawLotusPetals=function(x,y,r,tilt){
  var ctx=this.ctx;ctx.save();ctx.translate(x,y);ctx.rotate(tilt*0.2);
  var pulse=1+Math.sin(this._time*2)*0.05;
  for(var i=0;i<8;i++){
    var a=i*Math.PI/4+this._time*0.3;
    var px=Math.cos(a)*r*0.85*pulse,py=Math.sin(a)*r*0.85*pulse;
    ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI/2);
    var g=ctx.createLinearGradient(0,-r*0.2,0,r*0.2);
    g.addColorStop(0,'rgba(255,200,220,0.7)');g.addColorStop(1,'rgba(255,180,200,0.2)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r*0.14,r*0.06,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='rgba(255,220,240,0.15)';ctx.beginPath();ctx.arc(0,0,r*1.05*pulse,0,Math.PI*2);ctx.fill();
  ctx.restore();
};
Renderer.prototype._drawBuddhaAura=function(x,y,r,tilt){
  var ctx=this.ctx;ctx.save();ctx.translate(x,y);ctx.rotate(tilt*0.1);
  var pulse=1+Math.sin(this._time*1.5)*0.04;
  var g=ctx.createRadialGradient(0,0,r*0.9,0,0,r*1.3*pulse);
  g.addColorStop(0,'rgba(255,215,0,0)');g.addColorStop(0.5,'rgba(255,215,0,0.15)');g.addColorStop(1,'rgba(255,215,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.3*pulse,0,Math.PI*2);ctx.fill();
  for(var i=0;i<12;i++){
    var a=i*Math.PI/6+this._time*0.2;
    ctx.strokeStyle='rgba(255,215,0,0.2)';ctx.lineWidth=r*0.03;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r*0.95,Math.sin(a)*r*0.95);ctx.lineTo(Math.cos(a)*r*1.2*pulse,Math.sin(a)*r*1.2*pulse);ctx.stroke();
  }
  ctx.restore();
};
Renderer.prototype._drawImperialAura=function(x,y,r,tilt){
  var ctx=this.ctx;ctx.save();ctx.translate(x,y);ctx.rotate(tilt*0.1);
  var pulse=1+Math.sin(this._time*1.2)*0.05;
  var g=ctx.createRadialGradient(0,0,r*0.9,0,0,r*1.4*pulse);
  g.addColorStop(0,'rgba(255,215,0,0)');g.addColorStop(0.4,'rgba(255,215,0,0.18)');g.addColorStop(1,'rgba(255,180,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.4*pulse,0,Math.PI*2);ctx.fill();
  for(var i=0;i<6;i++){
    var a=i*Math.PI/3+this._time*0.15;
    var cx=Math.cos(a)*r*1.05*pulse,cy=Math.sin(a)*r*1.05*pulse;
    ctx.fillStyle='rgba(255,230,180,'+(0.25+Math.sin(this._time*2+i)*0.1)+')';
    ctx.beginPath();ctx.ellipse(cx,cy,r*0.1,r*0.05,a,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
};
Renderer.prototype._drawChaosSwirl=function(x,y,r,tilt){
  var ctx=this.ctx;ctx.save();ctx.translate(x,y);ctx.rotate(tilt*0.15);
  var pulse=1+Math.sin(this._time*0.8)*0.06;
  var g=ctx.createRadialGradient(0,0,r*0.85,0,0,r*1.5*pulse);
  g.addColorStop(0,'rgba(147,112,219,0)');g.addColorStop(0.3,'rgba(147,112,219,0.15)');g.addColorStop(0.7,'rgba(100,80,180,0.1)');g.addColorStop(1,'rgba(50,30,100,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.5*pulse,0,Math.PI*2);ctx.fill();
  for(var i=0;i<10;i++){
    var a=i*Math.PI/5+this._time*0.3;
    var sr=r*(1.0+Math.sin(this._time*1.5+i)*0.15)*pulse;
    var sx=Math.cos(a)*sr,sy=Math.sin(a)*sr;
    ctx.fillStyle='rgba(255,255,200,'+(0.3+Math.sin(this._time*3+i)*0.2)+')';
    ctx.beginPath();ctx.arc(sx,sy,r*0.025,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle='rgba(200,180,255,0.15)';ctx.lineWidth=r*0.02;
  for(var ri2=0;ri2<2;ri2++){
    ctx.beginPath();
    for(var ta=0;ta<Math.PI*2;ta+=0.1){
      var tr=r*(1.1+ri2*0.15)*pulse*(0.8+Math.sin(ta*3+this._time)*0.1);
      var tx=Math.cos(ta+this._time*0.2+ri2)*tr,ty=Math.sin(ta+this._time*0.2+ri2)*tr;
      if(ta===0)ctx.moveTo(tx,ty);else ctx.lineTo(tx,ty);
    }
    ctx.closePath();ctx.stroke();
  }
  ctx.restore();
};

// ════════════════════════════════════════════════════
//  主游戏逻辑
// ════════════════════════════════════════════════════
var STATE={READY:0,PLAYING:1,GAME_OVER:2};

function Game(canvas,screenWidth,screenHeight){
  this.canvas=canvas;this.ctx=canvas.getContext('2d');
  this.width=screenWidth;this.height=screenHeight;
  this.scale=screenWidth/CFG.BASE_WIDTH;
  this.physics=new PhysicsWorld(screenWidth,screenHeight);
  this.effects=new EffectManager();
  this.renderer=new Renderer(this.ctx,screenWidth,screenHeight,this.scale);
  this.state=STATE.READY;this.score=0;this.bestScore=this._loadBestScore();this.isNewBest=false;
  this.currentPig=null;this.nextLevel=this._randomLevel();this.spawnTimer=0;this.pigDropped=false;
  this.touching=false;this.touchX=screenWidth/2;this.dangerTimer=0;this._removeQueue=[];
  this._bindInput();this._spawnCurrentPig();
}
Game.prototype.update=function(dt){if(this.state===STATE.PLAYING)this._updatePlaying(dt);this.effects.update(dt);this.renderer.tick(dt);};
Game.prototype._updatePlaying=function(dt){
  this.physics.gravity=DEBUG.gravity;
  var substeps=DEBUG.substeps,subDt=dt/substeps;
  for(var i=0;i<substeps;i++)this.physics.step(subDt);
  this._checkMerges();this._cleanupMerged();
  var bodies=this.physics.bodies;
  for(var j=0;j<bodies.length;j++){if(bodies[j]===this.currentPig)continue;bodies[j].update(dt);}
  if(this.currentPig&&this.currentPig.static){
    var targetX=this.touching?this.touchX:this.currentPig.x;
    this.currentPig.x+=(targetX-this.currentPig.x)*0.3;
    var r=this.currentPig.radius;
    this.currentPig.x=Math.max(r,Math.min(this.width-r,this.currentPig.x));
    this.currentPig.update(dt);
  }
  if(this.pigDropped){
    this.spawnTimer+=dt;
    var minW=this.spawnTimer>=DEBUG.spawnDelay;
    var maxW=this.spawnTimer>=2.5;
    var settled=this._allPigsSettled();
    if(minW&&(settled||maxW)){this.pigDropped=false;this.spawnTimer=0;this._spawnCurrentPig();}
  }
  this._checkGameOver(dt);
};
Game.prototype._checkMerges=function(){
  var pairs=this.physics.collisionPairs;if(pairs.length===0)return;
  for(var i=0;i<pairs.length;i++){
    var pair=pairs[i],a=pair.a,b=pair.b;
    if(!a||!b)continue;if(a.merged||b.merged)continue;if(a.level!==b.level)continue;if(a.level>=CFG.MAX_LEVEL)continue;
    if(a===this.currentPig||b===this.currentPig)continue;
    a.merged=true;b.merged=true;
    var newLevel=a.level+1,midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
    this.physics.remove(a);this.physics.remove(b);
    var np=new Pig(newLevel,midX,midY,this.scale);
    np.static=false;np.vy=Math.min(a.vy,b.vy)*0.5;np.vx=(a.vx+b.vx)*0.3;
    np.spawnAnim=0;np.setExpression(EXPR.HAPPY,0.5);
    this.physics.add(np);
    var gain=CFG.PIG_LEVELS[newLevel-1].score;this.score+=gain;
    this.effects.burst(midX,midY,np.color,10+newLevel*2);
    this.effects.popup(midX,midY-np.radius,gain,this.scale);
  }
};
Game.prototype._cleanupMerged=function(){};
Game.prototype._allPigsSettled=function(){
  var bodies=this.physics.bodies;
  for(var i=0;i<bodies.length;i++){var b=bodies[i];if(b.static)continue;if(b.merged)continue;if(!b.isSettled())return false;if(b.spawnAnim<1)return false;}
  return true;
};
Game.prototype._checkGameOver=function(dt){
  var fenceY=this.renderer.fenceY,bodies=this.physics.bodies,any=false;
  for(var i=0;i<bodies.length;i++){var p=bodies[i];if(p.static)continue;if(p.spawnAnim<0.5)continue;if(p.y-p.radius<fenceY){if(p.isSettled()){any=true;break;}}}
  if(any){this.dangerTimer+=dt;if(this.dangerTimer>=DEBUG.dangerTime)this._gameOver();}
  else{this.dangerTimer=Math.max(0,this.dangerTimer-dt*2);}
};
Game.prototype._randomLevel=function(){return CFG.MIN_SPAWN_LEVEL+Math.floor(Math.random()*(CFG.MAX_SPAWN_LEVEL-CFG.MIN_SPAWN_LEVEL+1));};
Game.prototype._spawnCurrentPig=function(){
  var level=this.nextLevel;this.nextLevel=this._randomLevel();
  var spawnY=this.renderer.fenceY-this.height*CFG.LAYOUT.SPAWN_OFFSET-CFG.PIG_LEVELS[level-1].radius*this.scale;
  this.currentPig=new Pig(level,this.width/2,spawnY,this.scale);
  this.currentPig.static=true;this.physics.add(this.currentPig);
};
Game.prototype._dropPig=function(){if(!this.currentPig||!this.currentPig.static)return;this.currentPig.drop();this.currentPig=null;this.pigDropped=true;this.spawnTimer=0;};
Game.prototype._gameOver=function(){this.state=STATE.GAME_OVER;this.isNewBest=this.score>this.bestScore;if(this.isNewBest){this.bestScore=this.score;this._saveBestScore(this.bestScore);}};
Game.prototype.restart=function(){this.physics.clear();this.effects.clear();this.score=0;this.isNewBest=false;this.dangerTimer=0;this.currentPig=null;this.pigDropped=false;this.spawnTimer=0;this.nextLevel=this._randomLevel();this.state=STATE.PLAYING;this._spawnCurrentPig();};
Game.prototype._hitStartButton=function(x,y){var bW=180*this.scale,bH=50*this.scale,bX=(this.width-bW)/2,bY=this.height*0.68;return x>=bX&&x<=bX+bW&&y>=bY&&y<=bY+bH;};
Game.prototype._hitRestartButton=function(x,y){var bW=180*this.scale,bH=50*this.scale,bX=(this.width-bW)/2,bY=this.height*0.64;return x>=bX&&x<=bX+bW&&y>=bY&&y<=bY+bH;};
Game.prototype.render=function(){
  var r=this.renderer;r.drawBackground();
  if(this.state===STATE.READY){r.drawStartScreen();return;}
  var fenceState='normal',dp=0;
  if(this.state===STATE.PLAYING&&this.dangerTimer>0){dp=this.dangerTimer/DEBUG.dangerTime;fenceState=dp>0.5?'danger':'warn';}
  var bodies=this.physics.bodies;
  for(var i=0;i<bodies.length;i++){if(bodies[i]===this.currentPig)continue;r.drawPig(bodies[i],false);}
  if(this.currentPig&&this.currentPig.static)r.drawPig(this.currentPig,true);
  this.effects.render(this.ctx);
  r.drawFence(fenceState,dp);
  if(this.state===STATE.PLAYING)r.drawUI(this.score,this.bestScore,this.nextLevel);
  if(this.state===STATE.GAME_OVER)r.drawGameOver(this.score,this.bestScore,this.isNewBest);
};
Game.prototype._loadBestScore=function(){try{var v=localStorage.getItem('petMergeBestScore');return v?parseInt(v,10):0;}catch(e){return 0;}};
Game.prototype._saveBestScore=function(score){try{localStorage.setItem('petMergeBestScore',score.toString());}catch(e){}};
Game.prototype._bindInput=function(){
  var self=this;
  function getPos(e){
    var rect=self.canvas.getBoundingClientRect();
    var cx,cy;
    if(e.touches&&e.touches.length>0){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
    else{cx=e.clientX;cy=e.clientY;}
    return{x:cx-rect.left,y:cy-rect.top};
  }
  function onStart(e){
    e.preventDefault();
    var p=getPos(e);self.touchX=p.x;self.touching=true;
    if(self.state===STATE.READY){if(self._hitStartButton(p.x,p.y))self.state=STATE.PLAYING;}
    else if(self.state===STATE.GAME_OVER){if(self._hitRestartButton(p.x,p.y))self.restart();}
  }
  function onMove(e){
    e.preventDefault();
    var p=getPos(e);self.touchX=p.x;
  }
  function onEnd(e){
    e.preventDefault();self.touching=false;
    if(self.state===STATE.PLAYING&&self.currentPig&&self.currentPig.static)self._dropPig();
  }
  this.canvas.addEventListener('touchstart',onStart,{passive:false});
  this.canvas.addEventListener('touchmove',onMove,{passive:false});
  this.canvas.addEventListener('touchend',onEnd,{passive:false});
  this.canvas.addEventListener('mousedown',onStart);
  this.canvas.addEventListener('mousemove',function(e){if(self.touching)onMove(e);});
  this.canvas.addEventListener('mouseup',onEnd);
};

var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
var dpr=window.devicePixelRatio||1;

function resize(){
  var sw=window.innerWidth,sh=window.innerHeight;
  canvas.width=sw*dpr;canvas.height=sh*dpr;
  canvas.style.width=sw+'px';canvas.style.height=sh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();

var screenWidth=window.innerWidth;
var screenHeight=window.innerHeight;
var game=new Game(canvas,screenWidth,screenHeight);
window.game=game;

window.addEventListener('resize',function(){
  var sw=window.innerWidth,sh=window.innerHeight;
  canvas.width=sw*dpr;canvas.height=sh*dpr;
  canvas.style.width=sw+'px';canvas.style.height=sh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  game.physics.width=sw;game.physics.height=sh;
  game.renderer.width=sw;game.renderer.height=sh;
  game.renderer.fenceY=sh*CFG.LAYOUT.FENCE_RATIO;
  game.width=sw;game.height=sh;
  game.scale=sw/CFG.BASE_WIDTH;
});

var lastTime=0;
function loop(timestamp){
  if(lastTime===0)lastTime=timestamp;
  var dt=(timestamp-lastTime)/1000;lastTime=timestamp;
  if(dt>0.033)dt=0.033;if(dt<0)dt=0;
  try{game.update(dt);game.render();}catch(e){console.error('[西游合成] 运行异常:',e&&e.message?e.message:e);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

//  调试面板 UI
// ════════════════════════════════════════════════════
function buildDebugPanel() {
  var content = document.getElementById('debugContent');
  var html = '';
  for (var g = 0; g < SLIDER_CONFIG.length; g++) {
    var group = SLIDER_CONFIG[g];
    html += '<div class="debug-group">';
    html += '<div class="debug-group-title">' + group.title + '</div>';
    for (var i = 0; i < group.items.length; i++) {
      var item = group.items[i];
      var val = DEBUG[item.key];
      html += '<div class="debug-row">';
      html += '<span class="debug-label">' + item.label + '</span>';
      html += '<span class="debug-value" id="val-' + item.key + '">' + formatVal(val, item.step) + '</span>';
      html += '</div>';
      html += '<input type="range" class="debug-slider" id="slider-' + item.key + '" ';
      html += 'min="' + item.min + '" max="' + item.max + '" step="' + item.step + '" value="' + val + '">';
    }
    html += '</div>';
  }
  content.innerHTML = html;
  for (var g2 = 0; g2 < SLIDER_CONFIG.length; g2++) {
    var group2 = SLIDER_CONFIG[g2];
    for (var i2 = 0; i2 < group2.items.length; i2++) {
      bindSlider(group2.items[i2]);
    }
  }
}

function bindSlider(item) {
  var slider = document.getElementById('slider-' + item.key);
  var valSpan = document.getElementById('val-' + item.key);
  slider.addEventListener('input', function() {
    var val = parseFloat(slider.value);
    DEBUG[item.key] = val;
    valSpan.textContent = formatVal(val, item.step);
    if (item.key === 'baseRestitution' || item.key === 'restitutionDecay') {
      regenerateRestitution();
    }
  });
}

function exportDebug() {
  var lines = ['var DEBUG = {'];
  var first = true;
  for (var g = 0; g < SLIDER_CONFIG.length; g++) {
    var group = SLIDER_CONFIG[g];
    if (!first) lines.push('');
    lines.push('  // ' + group.title);
    for (var i = 0; i < group.items.length; i++) {
      var item = group.items[i];
      var val = formatVal(DEBUG[item.key], item.step);
      var isLast = (g === SLIDER_CONFIG.length - 1) && (i === group.items.length - 1);
      lines.push('  ' + item.key + ': ' + val + (isLast ? '' : ','));
    }
    first = false;
  }
  lines.push('};');
  return lines.join('\n');
}

function resetDebug() {
  for (var key in DEBUG_DEFAULTS) {
    if (DEBUG_DEFAULTS.hasOwnProperty(key)) {
      DEBUG[key] = DEBUG_DEFAULTS[key];
    }
  }
  for (var g = 0; g < SLIDER_CONFIG.length; g++) {
    var group = SLIDER_CONFIG[g];
    for (var i = 0; i < group.items.length; i++) {
      var item = group.items[i];
      var slider = document.getElementById('slider-' + item.key);
      var valSpan = document.getElementById('val-' + item.key);
      if (slider) slider.value = DEBUG[item.key];
      if (valSpan) valSpan.textContent = formatVal(DEBUG[item.key], item.step);
    }
  }
  regenerateRestitution();
}

buildDebugPanel();

var exportBtn = document.getElementById('btnExport');
var exportDiv = document.getElementById('debugExport');
var exportText = document.getElementById('exportText');
exportBtn.addEventListener('click', function() {
  if (exportDiv.classList.contains('visible')) {
    exportDiv.classList.remove('visible');
  } else {
    exportText.value = exportDebug();
    exportDiv.classList.add('visible');
  }
});
exportText.addEventListener('click', function() { this.select(); });

var applyBtn = document.getElementById('btnApply');
applyBtn.addEventListener('click', function() { regenerateRestitution(); });

var resetBtn = document.getElementById('btnReset');
resetBtn.addEventListener('click', function() { resetDebug(); });
</script>
</body>
</html>
