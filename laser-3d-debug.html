<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>激光镭射象棋 3D — 调试</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0e1a; }
body { display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; }
#wrap { position:relative; width:100%; height:100%; max-width:480px; margin:0 auto; }
#c { display:block; width:100%; height:100%; touch-action:none; }
#dbg {
  position:absolute; top:4px; left:6px; right:6px;
  font-size:11px; color:#6bc1ff; background:rgba(0,0,0,0.55);
  padding:4px 8px; border-radius:6px; pointer-events:none;
  font-family:monospace; line-height:1.5; z-index:10;
  display:none;
}
#dbg.show { display:block; }
#toolbar {
  position:absolute; bottom:6px; left:6px; right:6px;
  display:flex; gap:6px; z-index:10;
}
#toolbar button {
  flex:1; padding:6px 4px; font-size:11px; border:none; border-radius:6px;
  background:rgba(34,43,72,0.85); color:#e8ecf5; cursor:pointer;
  font-family:system-ui,sans-serif;
}
#toolbar button:active { background:rgba(61,169,252,0.7); }
#hint {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.7); color:#6bc1ff; padding:12px 20px;
  border-radius:10px; font-size:13px; z-index:20; pointer-events:none;
  text-align:center; line-height:1.8; display:none;
}
#hint.show { display:block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="dbg"></div>
  <div id="hint"></div>
  <div id="toolbar">
    <button id="btn-reset-view">重置视角</button>
    <button id="btn-toggle-dbg">调试信息</button>
    <button id="btn-restart">重新开始</button>
  </div>
</div>

<script>
var debugModules = {};
var module = { exports: {} };
function require(path) {
  var key = path.replace(/^\.\//, '').replace(/\.js$/, '');
  if (!debugModules[key]) throw new Error('Debug module not loaded: ' + path);
  return debugModules[key];
}
</script>
<script src="games/laser/glb-loader.js"></script>
<script>debugModules['glb-loader'] = module.exports; module = { exports: {} };</script>
<script src="games/laser/webgl-renderer.js"></script>
<script>debugModules['webgl-renderer'] = module.exports; module = { exports: {} };</script>
<script src="games/laser/laser-game.js"></script>
<script>
(function(){
  "use strict";
  var LaserGame = module.exports;
  if (!LaserGame || !LaserGame.create) {
    document.body.innerHTML = '<div style="color:#ff5a6e;padding:40px;font-size:14px;">模块加载失败，请通过本地服务器打开此页面</div>';
    return;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dbgEl = document.getElementById('dbg');
  var hintEl = document.getElementById('hint');

  // 显示提示
  function showHint(text, duration) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    if (duration) setTimeout(function(){ hintEl.classList.remove('show'); }, duration);
  }
  showHint('左键点击棋子\n左键/右键拖动旋转视角\n双指触摸旋转视角', 4000);

  // 尺寸适配
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    var wrap = document.getElementById('wrap');
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  resize();

  function debugPlatform() {
    return {
      createCanvas: function(){ return document.createElement('canvas'); },
      readAsset: function(assetPath, done){
        fetch(assetPath).then(function(response){
          if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + assetPath);
          return response.arrayBuffer();
        }).then(function(buffer){ done(null, buffer); }, done);
      },
      dpr: DPR
    };
  }

  // 创建游戏实例
  var game = LaserGame.create(ctx, W, H, function(){
    console.log('[debug] returnToMenu');
  }, debugPlatform());

  // 窗口大小变化时重建
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (game.exit) game.exit();
      resize();
      game = LaserGame.create(ctx, W, H, function(){}, debugPlatform());
    }, 300);
  });

  // ---- 触摸事件 ----
  function touchE(e) {
    var rect = canvas.getBoundingClientRect();
    var touches = [];
    var changed = [];
    if (e.touches) {
      for (var i = 0; i < e.touches.length; i++)
        touches.push({ clientX: e.touches[i].clientX - rect.left, clientY: e.touches[i].clientY - rect.top });
    }
    if (e.changedTouches) {
      for (var j = 0; j < e.changedTouches.length; j++)
        changed.push({ clientX: e.changedTouches[j].clientX - rect.left, clientY: e.changedTouches[j].clientY - rect.top });
    }
    return { touches: touches, changedTouches: changed };
  }

  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); game.onTouchStart(touchE(e)); }, {passive:false});
  canvas.addEventListener('touchmove',  function(e){ e.preventDefault(); game.onTouchMove(touchE(e));  }, {passive:false});
  canvas.addEventListener('touchend',   function(e){ e.preventDefault(); game.onTouchEnd(touchE(e));   }, {passive:false});
  canvas.addEventListener('touchcancel',function(e){ e.preventDefault(); game.onTouchEnd(touchE(e));   }, {passive:false});

  // ---- 鼠标事件 ----
  // 左键 = 点击棋子（模拟单指触摸）
  // 右键拖动 = 旋转视角（调用 cameraControl）
  var leftDown = false;
  var rightDown = false;
  var lastMouseX = 0, lastMouseY = 0;

  function mousePt(e) {
    var rect = canvas.getBoundingClientRect();
    return { clientX: e.clientX - rect.left, clientY: e.clientY - rect.top };
  }

  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  canvas.addEventListener('mousedown', function(e){
    e.preventDefault();
    var pt = mousePt(e);
    if (e.button === 0) {
      // 左键 = 点击
      leftDown = true;
      game.onTouchStart({ touches: [pt], changedTouches: [pt] });
    } else if (e.button === 2) {
      // 右键 = 旋转视角
      rightDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    }
  });

  canvas.addEventListener('mousemove', function(e){
    if (rightDown) {
      // 右键拖动 → 旋转视角
      var dx = e.clientX - lastMouseX;
      var dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (game.cameraControl) game.cameraControl(dx, dy);
    } else if (leftDown) {
      // 左键拖动 → 转发给游戏的 touchMove（支持单指拖动旋转视角）
      var pt = mousePt(e);
      game.onTouchMove({ touches: [pt], changedTouches: [pt] });
    }
  });

  canvas.addEventListener('mouseup', function(e){
    var pt = mousePt(e);
    if (e.button === 0 && leftDown) {
      leftDown = false;
      game.onTouchEnd({ touches: [], changedTouches: [pt] });
    } else if (e.button === 2) {
      rightDown = false;
    }
  });

  canvas.addEventListener('mouseleave', function(e){
    if (leftDown) {
      leftDown = false;
      var pt = mousePt(e);
      game.onTouchEnd({ touches: [], changedTouches: [pt] });
    }
    rightDown = false;
  });

  // ---- 键盘快捷键 ----
  window.addEventListener('keydown', function(e){
    if (e.key === 'r' || e.key === 'R') document.getElementById('btn-reset-view').click();
    if (e.key === 'd' || e.key === 'D') document.getElementById('btn-toggle-dbg').click();
  });

  // ---- 工具栏按钮 ----
  document.getElementById('btn-reset-view').addEventListener('click', function(){
    console.log('[debug] 请点击游戏内的"重置视角"按钮');
  });
  document.getElementById('btn-toggle-dbg').addEventListener('click', function(){
    dbgEl.classList.toggle('show');
  });
  document.getElementById('btn-restart').addEventListener('click', function(){
    if (game.exit) game.exit();
    game = LaserGame.create(ctx, W, H, function(){}, debugPlatform());
  });

  // ---- 主循环 ----
  var lastT = 0, fps = 0, frameCnt = 0, fpsT = 0;
  function loop(ts) {
    var dt = lastT ? (ts - lastT) / 1000 : 0.016;
    lastT = ts;
    if (dt > 0.033) dt = 0.033;
    if (dt < 0) dt = 0;

    frameCnt++;
    fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frameCnt / fpsT); frameCnt = 0; fpsT = 0; }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;

    try {
      if (game.update) game.update(dt);
      if (game.render) game.render();
    } catch(e) { console.error('[render]', e); }

    if (dbgEl.classList.contains('show')) {
      dbgEl.textContent = 'FPS: ' + fps +
        '\n尺寸: ' + W + 'x' + H + ' DPR:' + DPR +
        '\n左键点击=棋子 | 左键/右键拖动=旋转视角';
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  console.log('%c激光镭射象棋 3D 调试模式', 'color:#ffe14d;font-size:16px;font-weight:bold');
  console.log('操作说明:');
  console.log('  左键点击 = 选择/移动棋子');
  console.log('  左键/右键拖动 = 旋转3D视角');
  console.log('  单指/双指触摸拖动 = 旋转视角（手机）');
  console.log('  R = 重置视角  D = 调试信息');
})();
</script>
</body>
</html>
